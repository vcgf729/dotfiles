# NotchGuard tunables — edit and save; applies on the next Atoll open/close.
# Frames run at 120 per second. Curves: linear, quadratic, tanh, sin, exp, circ
# (tanh = fast start then eases out, like Atoll's spring; sin = gentle both ends)

# Opening: pills shrink to hug Atoll as it grows
open_curve = tanh
open_frames = 36
open_delay = 0

# Closing: pills follow Atoll back in
close_curve = sin
close_frames = 45
close_delay = 0.12

# Must match Atoll's "openNotchWidth"
atoll_open_width = 690

# Atoll's small volume/brightness HUD (set hud_enabled = 0 to turn off)
hud_enabled = 1
# Total gap while the HUD shows (notch alone = 210)
hud_width = 400
# Seconds the HUD stays before the bar slides back
hud_duration = 1.5
hud_open_frames = 10
hud_close_frames = 36

# How long the mouse must rest on the notch before the bar treats Atoll as open
atoll_hover_delay = 0.12
# How far past the notch's edges still counts as "on the notch" (points)
atoll_hover_pad = 4
